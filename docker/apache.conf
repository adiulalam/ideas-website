ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Only public/ is web-accessible. The old setup served the whole repository
    # (including .git/, deploy scripts and library internals) with directory
    # listings enabled.
    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Static assets: plain 404s instead of falling back to PHP.
    <Directory /var/www/html/public/assets>
        FallbackResource disabled
    </Directory>

    # User uploads: never execute or render anything except images.
    <Directory /var/www/html/public/assets/img>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
        <FilesMatch "(?i)\.(php\d?|phtml|phar|pht|cgi|pl|py|sh|html?|xhtml|svgz?|js|mjs)$">
            Require all denied
        </FilesMatch>
        Header set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
    </Directory>

    # Dotfiles (.htaccess, .git, .env, ...) are never served.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
