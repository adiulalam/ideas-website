; Production PHP settings for Ideal Ideas.

; Never show errors to visitors; log them to the container output instead.
; (The old .htaccess set display_errors On.)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
expose_php = Off

date.timezone = Europe/London
default_charset = "UTF-8"

memory_limit = 128M
max_execution_time = 30
max_input_time = 30
default_socket_timeout = 10
allow_url_include = Off

; PDO::ATTR_TIMEOUT only bounds the TCP connect. A MySQL server that accepts
; the connection but never answers would otherwise block for 86400 s (the
; default), and max_execution_time does not count time spent waiting on I/O.
mysqlnd.net_read_timeout = 10

file_uploads = On
upload_max_filesize = 5M
post_max_size = 8M
max_file_uploads = 2

session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 28800

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
