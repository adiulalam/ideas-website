name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs this via deploy.yml before deploying
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: Lint, static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: mbstring, fileinfo, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer audit
      - run: composer lint
      - run: composer analyse
      - run: composer test

  docker:
    name: Docker image and Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the production stack against example.env
        run: docker compose --env-file example.env -f docker-compose.yml config --quiet
      - name: Validate the development stack
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Shell scripts parse
        run: for f in deploy-ideas-website.sh bin/*.sh docker/*.sh; do bash -n "$f"; done
      - run: docker build --pull --tag ideas-website:ci .
